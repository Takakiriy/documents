<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212);" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="601px" height="681px" viewBox="-0.5 -0.5 601 681" content="&lt;mxfile&gt;&lt;diagram id=&quot;xRdoTwZvirdtfvDg6jgX&quot; name=&quot;Page-1&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g><rect x="1" y="460" width="560" height="220" rx="15.4" ry="15.4" fill="#d5e8d4" stroke="#82b366" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><rect x="21" y="490" width="540" height="170" fill="none" stroke="none" pointer-events="all"/></g><g><g transform="translate(-0.5 -0.5)"><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 538px; height: 1px; padding-top: 497px; margin-left: 23px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #4D4D4D; "><div style="display: inline-block; font-size: 11px; font-family: &quot;Helvetica&quot;; color: light-dark(#4D4D4D, #ababab); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><div><span style="font-size: 11px;">- 式</span></div><div><span style="font-size: 11px;">　　- </span><span style="background-color: transparent; font-size: 11px;">🟣</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">字面（式の字面）</span></div><div><span style="font-size: 11px;">　　- </span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">🟢</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">意味(aをb回足す操作)（字面の解釈のひとつ）= 解釈A（とする）</span></div><div><span style="font-size: 11px;">　　- 解釈B</span></div><div><span style="font-size: 11px;">　　- 解釈C</span></div><div><span style="font-size: 11px;">　　- ...</span></div><div><span style="font-size: 11px;">　　- </span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">🟠</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">値（計算結果）</span></div><div><span style="font-size: 11px;">　　- （順序派が言う）式の指すものは、</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">🔴</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">前者と</span><span style="background-color: transparent; font-size: 11px;">🔷</span><span style="background-color: transparent; color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183));">後者（一緒くたにしている。区別ができてない）</span></div><div><span style="font-size: 11px;"><br /></span></div><div><span style="font-size: 11px;">- </span><span style="background-color: transparent; font-size: 11px;">🔴</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">数学的対象（順序派の言う</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">🟠</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">値に近い）（≠計算結果,計算前の式）（前者。数学が等号などで扱う対象）</span></div><div><span style="font-size: 11px;"><br /></span></div><div><span style="background-color: transparent; font-size: 11px;">🔷</span><span style="font-size: 11px;">後者。_(?)_は、一意にすら定まらないもの</span></div></div></div></div></foreignObject><text x="23" y="508" fill="#4D4D4D" font-family="&quot;Helvetica&quot;" font-size="11px">- 式...</text></switch></g></g><g><rect x="1" y="300" width="150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g transform="translate(-0.5 -0.5)"><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 148px; height: 1px; padding-top: 307px; margin-left: 3px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #1976D2; "><div style="display: inline-block; font-size: 12px; font-family: &quot;Helvetica&quot;; color: light-dark(#1976D2, #4f9fee); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">ゲルくんの発言</div></div></div></foreignObject><text x="3" y="319" fill="#1976D2" font-family="&quot;Helvetica&quot;" font-size="12px" font-weight="bold">ゲルくんの発言</text></switch></g></g><g><rect x="21" y="330" width="540" height="100" fill="none" stroke="none" pointer-events="all"/></g><g><g transform="translate(-0.5 -0.5)"><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 538px; height: 1px; padding-top: 337px; margin-left: 23px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #4D4D4D; "><div style="display: inline-block; font-size: 11px; font-family: &quot;Helvetica&quot;; color: light-dark(#4D4D4D, #ababab); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><div><span style="font-size: 11px;">私は一意に字面=意味(aをb回足す操作)だとは考えていない。いくつもある式の解釈の一つ。例えば、a×bは「aとbを掛ける」とも「aにbを掛ける」とも「bにaを掛ける」とも解釈できる。そう考えている。</span></div><div><span style="font-size: 11px;"><br /></span></div><div><span style="font-size: 11px;">二つ目は、数学的対象は順序派の言う値に近い。一方、彼らの言う意味は、字面の解釈のひとつ。前者は数学が等号などで扱う対象。後者はそうではなく、一意にすら定まらないもの。これら二つを式の指すものとして一緒くたにしているので、「区別ができてない」と表現した。</span><br /><span style="font-size: 11px;">https://x.com/esuthi_v2/status/1959284415814570278</span></div></div></div></div></foreignObject><text x="23" y="348" fill="#4D4D4D" font-family="&quot;Helvetica&quot;" font-size="11px">私は一意に字面=意味(aをb回足す操作)だとは考えていない。いくつもある式の解釈の一つ。例えば、a×bは「aとbを掛ける」とも「aにbを掛ける」とも「bにaを掛ける」とも解釈できる。そう考えている。...</text></switch></g></g><g><rect x="21" y="220" width="540" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g transform="translate(-0.5 -0.5)"><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 538px; height: 1px; padding-top: 227px; margin-left: 23px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #4D4D4D; "><div style="display: inline-block; font-size: 11px; font-family: &quot;Helvetica&quot;; color: light-dark(#4D4D4D, #ababab); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><div><span style="font-size: 11px;">そうだね。異なる。ならば、それでキミの最初の</span></div><div><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">　　&gt; 字面とそれが指す数学的対象の区別がついてないことが伺える。</span></div><div><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">これは矛盾してない？字面=意味だとキミは考えていると思うから、区別がついていると思うけど</span></div><div><span style="background-color: transparent; color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183));"><span style="font-size: 11px;">https://x.com/Ts_Neko/status/1959275053188866062</span></span></div></div></div></div></foreignObject><text x="23" y="238" fill="#4D4D4D" font-family="&quot;Helvetica&quot;" font-size="11px">そうだね。異なる。ならば、それでキミの最初の　　&gt; 字面とそれが指す数学的対象の区別がついてないことが伺える。...</text></switch></g></g><g><rect x="1" y="130" width="120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g transform="translate(-0.5 -0.5)"><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 118px; height: 1px; padding-top: 137px; margin-left: 3px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #7B1FA2; "><div style="display: inline-block; font-size: 12px; font-family: &quot;Helvetica&quot;; color: light-dark(#7B1FA2, #efa0ff); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">T's-Nekoの発言</div></div></div></foreignObject><text x="3" y="149" fill="#7B1FA2" font-family="&quot;Helvetica&quot;" font-size="12px" font-weight="bold">T's-Nekoの発言</text></switch></g></g><g><rect x="21" y="160" width="580" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g transform="translate(-0.5 -0.5)"><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 578px; height: 1px; padding-top: 167px; margin-left: 23px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #4D4D4D; "><div style="display: inline-block; font-size: 11px; font-family: &quot;Helvetica&quot;; color: light-dark(#4D4D4D, #ababab); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><div><span style="font-size: 11px;">&gt; 順序派が言う「式が持つ情報は値と意味だ」というのは、式を(値,意味)の対だと見ると言うことでいいのかな？</span></div><div><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">式には🟠値（計算結果）と</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">🟢</span><span style="background-color: transparent;">意味（計算する前の式）の両方の側面はあるね。</span></div><div><span style="font-size: 11px;">https://x.com/Ts_Neko/status/1959269272301027668</span></div><div><br /></div></div></div></div></foreignObject><text x="23" y="178" fill="#4D4D4D" font-family="&quot;Helvetica&quot;" font-size="11px">&gt; 順序派が言う「式が持つ情報は値と意味だ」というのは、式を(値,意味)の対だと見ると言うことでいいのかな？...</text></switch></g></g><g><rect x="11" y="460" width="120" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g transform="translate(-0.5 -0.5)"><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 118px; height: 1px; padding-top: 467px; margin-left: 13px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #5aa31f; "><div style="display: inline-block; font-size: 12px; font-family: &quot;Helvetica&quot;; color: light-dark(#5aa31f, #efa0ff); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">構造</div></div></div></foreignObject><text x="13" y="479" fill="light-dark(#5aa31f, #efa0ff)" font-family="&quot;Helvetica&quot;" font-size="12px" font-weight="bold">構造</text></switch></g></g><g><path d="M 311 605 L 521 605" fill="none" stroke="#0000ff" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(0, 0, 255), rgb(205, 205, 255));"/></g><g><rect x="1" y="0" width="150" height