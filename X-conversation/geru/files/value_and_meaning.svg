nd-color: transparent; font-size: 11px;">🟣</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">字面とそれが指す</span><span style="color: light-dark(rgb(63, 63, 63), rgb(183, 183, 183)); background-color: transparent;">🔴</span><span style="background-color: transparent;">数学的対象の区別がついてないことが伺える。</span></div><div><span style="font-size: 11px;">3+3+3+3も4+4+4も、12が指す数学的対象と同一のものを指す。別物ではない。</span><br /><span style="font-size: 11px;">https://x.com/esuthi_v2/status/1958826105713938484</span></div></div></div></div></foreignObject><text x="23" y="48" fill="#4D4D4D" font-family="&quot;Helvetica&quot;" font-size="11px">SUO&gt; 「3+3+3+3」と「4+4+4」は、見てのとおり別物...</text></switch></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot display</text></a></switch></svg>